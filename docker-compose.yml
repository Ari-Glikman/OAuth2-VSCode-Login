services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: vscode-oauth-keycloak
    # The issuer must be identical for VS Code (on your machine) and for IRIS (in Docker),
    # so both use the name "keycloak". Add "127.0.0.1 keycloak" to your hosts file.
    command: ["start-dev", "--hostname=http://keycloak:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

  iris:
    image: containers.intersystems.com/intersystems/iris-community:latest-cd
    container_name: vscode-oauth-iris
    init: true
    # Applied at startup: keep the default SYS passwords without a change prompt (demo only).
    environment:
      ISC_CPF_MERGE_FILE: /merge.cpf
    configs:
      - source: iris-merge
        target: /merge.cpf
    ports:
      - "52773:52773"
    depends_on: [keycloak]

configs:
  iris-merge:
    content: |
      [Actions]
      ModifyUser:Name=_SYSTEM,ChangePassword=0,PasswordNeverExpires=1
      ModifyUser:Name=SuperUser,ChangePassword=0,PasswordNeverExpires=1
      ModifyUser:Name=Admin,ChangePassword=0,PasswordNeverExpires=1
